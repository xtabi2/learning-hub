<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Ship HUD interior chrome">
  <defs>
    <linearGradient id="hs-cabin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7e8f6"/>
      <stop offset="40%" stop-color="#FBF6EE"/>
      <stop offset="100%" stop-color="#e8d9b8"/>
    </linearGradient>
    <linearGradient id="hs-wind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <radialGradient id="hs-screen" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#16324a"/>
      <stop offset="100%" stop-color="#0b1e2c"/>
    </radialGradient>
    <linearGradient id="hs-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe0"/>
      <stop offset="100%" stop-color="#c9b896"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#hs-cabin)"/>

  <!-- hull curve / ceiling -->
  <path d="M0 220 Q512 20 1024 220 L1024 0 L0 0 Z" fill="#3A82C4" opacity="0.18"/>
  <path d="M40 0 Q512 80 984 0" fill="none" stroke="#3A82C4" stroke-width="18" stroke-linecap="round" opacity="0.35"/>

  <!-- windshield showing space -->
  <path d="M96 40 Q512 110 928 40 L880 210 Q512 270 144 210 Z" fill="url(#hs-wind)" stroke="#1d3023" stroke-width="8" stroke-linejoin="round"/>
  <g fill="#fde68a">
    <circle cx="240" cy="100" r="3"/><circle cx="400" cy="80" r="2"/>
    <circle cx="560" cy="120" r="3"/><circle cx="720" cy="90" r="2"/>
    <circle cx="820" cy="140" r="2.5"/><circle cx="300" cy="160" r="2"/>
    <circle cx="640" cy="70" r="2"/>
  </g>
  <circle cx="780" cy="110" r="14" fill="#e4b84a" opacity="0.7"/>
  <!-- windshield shine -->
  <path d="M180 80 Q360 130 500 100" fill="none" stroke="#e0f2fe" stroke-width="6" opacity="0.25" stroke-linecap="round"/>

  <!-- MAIN SCREEN area for star map (center) -->
  <rect x="148" y="300" width="728" height="480" rx="48" fill="url(#hs-bezel)" stroke="#2f4d37" stroke-width="8"/>
  <rect x="176" y="328" width="672" height="424" rx="36" fill="url(#hs-screen)"/>
  <!-- faint screen grid, very soft -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.12">
    <path d="M176 430 H848"/><path d="M176 540 H848"/><path d="M176 650 H848"/>
    <path d="M344 328 V752"/><path d="M512 328 V752"/><path d="M680 328 V752"/>
  </g>
  <text x="512" y="520" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#7dd3fc" opacity="0.55">star map</text>
  <!-- screen glow rim (solid, not dashed) -->
  <rect x="176" y="328" width="672" height="424" rx="36" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.28"/>

  <!-- left instrument cluster -->
  <g>
    <rect x="28" y="340" width="108" height="280" rx="28" fill="#FBF6EE" stroke="#2f4d37" stroke-width="5"/>
    <circle cx="82" cy="400" r="32" fill="#e7e5e4" stroke="#3A82C4" stroke-width="5"/>
    <path d="M82 400 L82 376" stroke="#E88E35" stroke-width="4" stroke-linecap="round"/>
    <circle cx="82" cy="490" r="26" fill="#e7e5e4" stroke="#A4D65E" stroke-width="5"/>
    <circle cx="82" cy="490" r="8" fill="#A4D65E"/>
    <circle cx="82" cy="568" r="18" fill="#e4b84a"/>
  </g>

  <!-- right instrument cluster -->
  <g>
    <rect x="888" y="340" width="108" height="280" rx="28" fill="#FBF6EE" stroke="#2f4d37" stroke-width="5"/>
    <circle cx="942" cy="400" r="32" fill="#e7e5e4" stroke="#38bdf8" stroke-width="5"/>
    <path d="M942 400 L958 382" stroke="#3A82C4" stroke-width="4" stroke-linecap="round"/>
    <rect x="916" y="452" width="52" height="16" rx="8" fill="#A4D65E"/>
    <rect x="916" y="478" width="52" height="16" rx="8" fill="#e4b84a"/>
    <rect x="916" y="504" width="52" height="16" rx="8" fill="#38bdf8" opacity="0.6"/>
    <circle cx="942" cy="568" r="18" fill="#38bdf8"/>
  </g>

  <!-- bottom console -->
  <rect x="120" y="820" width="784" height="160" rx="40" fill="#FBF6EE" stroke="#2f4d37" stroke-width="6"/>
  <g>
    <circle cx="240" cy="900" r="28" fill="#E88E35" stroke="#9a3412" stroke-width="4"/>
    <circle cx="340" cy="900" r="28" fill="#e4b84a" stroke="#a16207" stroke-width="4"/>
    <circle cx="440" cy="900" r="28" fill="#3A82C4" stroke="#1e3a5f" stroke-width="4"/>
    <rect x="520" y="872" width="300" height="56" rx="28" fill="#dbeafe" stroke="#3A82C4" stroke-width="4"/>
    <text x="670" y="908" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#1d3023">pilot console</text>
  </g>

  <!-- soft rivets -->
  <g fill="#c9b896">
    <circle cx="168" cy="316" r="6"/><circle cx="856" cy="316" r="6"/>
    <circle cx="168" cy="764" r="6"/><circle cx="856" cy="764" r="6"/>
  </g>
</svg>
