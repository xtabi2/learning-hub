<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Tidal ocean floor — oxygen tank hide">
  <defs>
    <linearGradient id="ox-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8ecfa"/>
      <stop offset="35%" stop-color="#5ec8e8"/>
      <stop offset="75%" stop-color="#2a8fb8"/>
      <stop offset="100%" stop-color="#1a6a86"/>
    </linearGradient>
    <radialGradient id="ox-sand" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#f3e0b8"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </radialGradient>
    <linearGradient id="ox-tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4a882"/>
      <stop offset="40%" stop-color="#e0cba0"/>
      <stop offset="100%" stop-color="#b8956c"/>
    </linearGradient>
    <linearGradient id="ox-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fff8dc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#ox-water)"/>

  <!-- light rays -->
  <polygon points="280,0 360,0 300,720 200,720" fill="url(#ox-ray)"/>
  <polygon points="520,0 580,0 540,640 460,640" fill="url(#ox-ray)"/>
  <polygon points="760,0 820,0 800,700 720,700" fill="url(#ox-ray)"/>

  <!-- bubbles -->
  <g fill="#e0f2fe" opacity="0.55" stroke="#7dd3fc" stroke-width="2">
    <circle cx="90" cy="180" r="10"/><circle cx="140" cy="320" r="7"/>
    <circle cx="70" cy="480" r="5"/><circle cx="960" cy="220" r="9"/>
    <circle cx="910" cy="380" r="6"/><circle cx="200" cy="140" r="4"/>
    <circle cx="850" cy="160" r="5"/><circle cx="500" cy="80" r="6"/>
  </g>

  <!-- sandy floor -->
  <ellipse cx="512" cy="980" rx="620" ry="220" fill="url(#ox-sand)"/>
  <ellipse cx="180" cy="920" rx="260" ry="90" fill="#e8d4a8"/>
  <ellipse cx="860" cy="930" rx="240" ry="80" fill="#e8d4a8"/>
  <!-- sand ripples -->
  <g fill="none" stroke="#c4a882" stroke-width="3" opacity="0.35">
    <path d="M40 900 Q160 880 280 900"/><path d="M300 940 Q420 920 540 940"/>
    <path d="M560 910 Q700 890 840 910"/>
  </g>

  <!-- seagrass -->
  <g fill="#4a7c2a" opacity="0.75">
    <path d="M80 920 Q100 840 70 780 Q110 850 90 920 Z"/>
    <path d="M110 930 Q140 850 120 770 Q150 860 130 930 Z"/>
    <path d="M940 920 Q920 840 950 780 Q910 850 930 920 Z"/>
    <path d="M900 930 Q870 850 890 770 Q860 860 880 930 Z"/>
    <path d="M200 940 Q220 870 190 820 Q230 880 210 940 Z"/>
  </g>

  <!-- coral clumps LEFT -->
  <g>
    <ellipse cx="160" cy="820" rx="50" ry="36" fill="#E88E35" stroke="#9a3412" stroke-width="4"/>
    <ellipse cx="130" cy="790" rx="22" ry="40" fill="#F8A4B8" stroke="#be185d" stroke-width="3"/>
    <ellipse cx="190" cy="786" rx="20" ry="38" fill="#F8A4B8" stroke="#be185d" stroke-width="3"/>
    <ellipse cx="160" cy="770" rx="18" ry="34" fill="#fb7185" stroke="#be185d" stroke-width="3"/>
    <ellipse cx="210" cy="830" rx="28" ry="22" fill="#e4b84a" stroke="#a16207" stroke-width="3"/>
  </g>

  <!-- friendly sea creatures -->
  <!-- yellow smile fish -->
  <g>
    <ellipse cx="240" cy="520" rx="46" ry="28" fill="#FFC107" stroke="#a16207" stroke-width="4"/>
    <path d="M286 520 L316 500 L316 540 Z" fill="#E88E35" stroke="#a16207" stroke-width="3"/>
    <circle cx="222" cy="512" r="8" fill="#fff"/>
    <circle cx="224" cy="514" r="4" fill="#1d3023"/>
    <circle cx="226" cy="511" r="1.6" fill="#fff"/>
    <path d="M210 528 Q224 536 236 528" fill="none" stroke="#a16207" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="214" cy="522" rx="5" ry="3" fill="#F8A4B8" opacity="0.7"/>
  </g>
  <!-- mint stripe fish -->
  <g>
    <ellipse cx="820" cy="400" rx="40" ry="22" fill="#99f6e4" stroke="#0f766e" stroke-width="4"/>
    <path d="M860 400 L886 386 L886 414 Z" fill="#14b8a6" stroke="#0f766e" stroke-width="3"/>
    <path d="M800 388 Q820 400 800 412" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <circle cx="804" cy="394" r="6" fill="#fff"/>
    <circle cx="806" cy="396" r="3" fill="#1d3023"/>
  </g>
  <!-- pink starfish -->
  <g transform="translate(300 860)">
    <path d="M0 -28 L8 -8 28 -8 12 6 18 26 0 14 -18 26 -12 6 -28 -8 -8 -8 Z" fill="#F8A4B8" stroke="#be185d" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="-6" cy="-2" r="3" fill="#1d3023"/>
    <circle cx="6" cy="-2" r="3" fill="#1d3023"/>
    <path d="M-6 6 Q0 10 6 6" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- seahorse -->
  <g>
    <path d="M880 620 Q900 560 868 530 Q900 520 910 550 Q930 620 900 660 Q870 680 880 640" fill="#A4D65E" stroke="#3f6b2a" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="878" cy="528" r="14" fill="#A4D65E" stroke="#3f6b2a" stroke-width="3"/>
    <circle cx="874" cy="524" r="4" fill="#fff"/>
    <circle cx="875" cy="525" r="2" fill="#1d3023"/>
    <path d="M864 532 Q858 536 864 538" fill="none" stroke="#3f6b2a" stroke-width="2"/>
  </g>
  <!-- shy sand dollar -->
  <ellipse cx="460" cy="900" rx="28" ry="16" fill="#e8d4a8" stroke="#c4a882" stroke-width="3"/>
  <path d="M460 888 L460 912 M448 900 L472 900 M452 892 L468 908 M468 892 L452 908" stroke="#c4a882" stroke-width="1.5" opacity="0.6"/>

  <!-- PLAYFUL SANDCASTLE (center-right) -->
  <!-- base -->
  <rect x="540" y="790" width="260" height="70" rx="18" fill="#e8d4a8" stroke="#b8956c" stroke-width="5"/>
  <!-- keep -->
  <rect x="620" y="660" width="110" height="140" rx="16" fill="#e0cba0" stroke="#b8956c" stroke-width="5"/>
  <!-- merlons on keep -->
  <rect x="622" y="644" width="22" height="22" rx="4" fill="#e0cba0" stroke="#b8956c" stroke-width="3"/>
  <rect x="664" y="640" width="22" height="26" rx="4" fill="#e0cba0" stroke="#b8956c" stroke-width="3"/>
  <rect x="706" y="644" width="22" height="22" rx="4" fill="#e0cba0" stroke="#b8956c" stroke-width="3"/>
  <!-- windows -->
  <rect x="648" y="700" width="22" height="28" rx="10" fill="#c4a882"/>
  <rect x="680" y="740" width="22" height="28" rx="10" fill="#c4a882"/>
  <!-- lime flag -->
  <rect x="672" y="590" width="6" height="54" rx="3" fill="#2f4d37"/>
  <path d="M678 592 L720 606 L678 620 Z" fill="#A4D65E" stroke="#3f6b2a" stroke-width="2"/>
  <!-- RIGHT turret (real turret with merlons) -->
  <rect x="736" y="700" width="56" height="100" rx="14" fill="#e8d4a8" stroke="#b8956c" stroke-width="5"/>
  <rect x="738" y="686" width="16" height="18" rx="3" fill="#e8d4a8" stroke="#b8956c" stroke-width="3"/>
  <rect x="756" y="684" width="16" height="20" rx="3" fill="#e8d4a8" stroke="#b8956c" stroke-width="3"/>
  <rect x="774" y="686" width="16" height="18" rx="3" fill="#e8d4a8" stroke="#b8956c" stroke-width="3"/>
  <!-- door -->
  <rect x="652" y="790" width="36" height="44" rx="16" fill="#c4a882" stroke="#b8956c" stroke-width="3"/>
  <!-- shells on castle -->
  <ellipse cx="580" cy="810" rx="14" ry="10" fill="#F8A4B8" stroke="#be185d" stroke-width="2"/>
  <ellipse cx="770" cy="818" rx="12" ry="8" fill="#38bdf8" stroke="#0369a1" stroke-width="2"/>

  <!-- CORAL cluster hugging LEFT of castle — hide lives here -->
  <g>
    <ellipse cx="560" cy="760" rx="48" ry="34" fill="#E88E35" stroke="#9a3412" stroke-width="4"/>
    <ellipse cx="530" cy="730" rx="20" ry="42" fill="#fb7185" stroke="#be185d" stroke-width="3"/>
    <ellipse cx="552" cy="718" rx="16" ry="38" fill="#F8A4B8" stroke="#be185d" stroke-width="3"/>
    <ellipse cx="574" cy="726" rx="16" ry="36" fill="#fb7185" stroke="#be185d" stroke-width="3"/>
    <ellipse cx="590" cy="770" rx="26" ry="20" fill="#e4b84a" stroke="#a16207" stroke-width="3"/>
    <ellipse cx="518" cy="770" rx="22" ry="16" fill="#E88E35" stroke="#9a3412" stroke-width="3"/>
  </g>

  <!-- OXYGEN TANK hide — camouflaged as a sand-colored cylinder / "turret"
       center (616, 696) = leftPct 60.2 / topPct 68.0
       body ~76x120, hit ≥64px. No dashed ring. -->
  <g>
    <!-- soft blend shadow into coral/sand -->
    <ellipse cx="616" cy="760" rx="40" ry="14" fill="#b8956c" opacity="0.35"/>
    <!-- tank body: sand-matched, slightly cooler/metallic -->
    <rect x="578" y="636" width="76" height="124" rx="30" fill="url(#ox-tank)" stroke="#a88860" stroke-width="5"/>
    <!-- subtle highlight so it reads as a cylinder -->
    <rect x="588" y="650" width="22" height="96" rx="12" fill="#f0e0c0" opacity="0.35"/>
    <!-- valve / gauge = turret cap on second look -->
    <rect x="598" y="608" width="36" height="32" rx="10" fill="#c4a882" stroke="#a88860" stroke-width="4"/>
    <circle cx="616" cy="620" r="8" fill="#d4c4a0" stroke="#8a7048" stroke-width="2.5"/>
    <rect x="610" y="590" width="12" height="20" rx="5" fill="#b8956c"/>
    <!-- faint straps, sand-colored -->
    <path d="M574 690 Q566 700 574 710" fill="none" stroke="#a88860" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M658 690 Q666 700 658 710" fill="none" stroke="#a88860" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- extra coral fronds overlapping tank base so it nestles -->
  <ellipse cx="568" cy="748" rx="18" ry="28" fill="#fb7185" stroke="#be185d" stroke-width="3" opacity="0.9"/>
  <ellipse cx="662" cy="752" rx="16" ry="24" fill="#F8A4B8" stroke="#be185d" stroke-width="3" opacity="0.85"/>

  <!-- more coral / sand overlap so tank reads as castle cluster -->
  <ellipse cx="600" cy="758" rx="22" ry="18" fill="#E88E35" stroke="#9a3412" stroke-width="3"/>
  <ellipse cx="640" cy="764" rx="18" ry="16" fill="#e4b84a" stroke="#a16207" stroke-width="3"/>
  <ellipse cx="548" cy="742" rx="14" ry="22" fill="#F8A4B8" stroke="#be185d" stroke-width="3"/>
</svg>
