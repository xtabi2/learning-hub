<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Tidal sunken ship — sonar hide">
  <defs>
    <linearGradient id="sn-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ad4e8"/>
      <stop offset="40%" stop-color="#3a9bb8"/>
      <stop offset="100%" stop-color="#1a5c72"/>
    </linearGradient>
    <radialGradient id="sn-sand" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#e8d4a0"/>
      <stop offset="100%" stop-color="#c4a46e"/>
    </radialGradient>
    <radialGradient id="sn-gold" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="60%" stop-color="#e4b84a"/>
      <stop offset="100%" stop-color="#c4922a"/>
    </radialGradient>
    <linearGradient id="sn-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fff3bf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#sn-water)"/>
  <polygon points="160,0 230,0 190,700 100,700" fill="url(#sn-ray)"/>
  <polygon points="700,0 760,0 730,640 650,640" fill="url(#sn-ray)"/>

  <!-- bubbles -->
  <g fill="#e0f2fe" opacity="0.45" stroke="#7dd3fc" stroke-width="2">
    <circle cx="80" cy="160" r="8"/><circle cx="960" cy="200" r="7"/>
    <circle cx="120" cy="400" r="5"/><circle cx="900" cy="360" r="6"/>
    <circle cx="500" cy="80" r="4"/>
  </g>

  <!-- sandy floor -->
  <ellipse cx="512" cy="980" rx="640" ry="210" fill="url(#sn-sand)"/>
  <ellipse cx="200" cy="920" rx="280" ry="80" fill="#e0c890"/>
  <ellipse cx="840" cy="930" rx="260" ry="80" fill="#e0c890"/>

  <!-- seagrass -->
  <g fill="#3d6b3a" opacity="0.7">
    <path d="M60 920 Q80 840 50 780 Q90 850 70 920 Z"/>
    <path d="M980 920 Q960 840 990 780 Q950 850 970 920 Z"/>
  </g>

  <!-- SUNKEN toy ship, tilted, friendly (left) -->
  <g transform="translate(260 780) rotate(-14)">
    <!-- hull -->
    <ellipse cx="0" cy="40" rx="170" ry="70" fill="#FBF6EE" stroke="#2f4d37" stroke-width="7"/>
    <path d="M-170 40 Q-160 90 0 100 Q160 90 170 40 Q80 70 -0 70 Q-80 70 -170 40 Z" fill="#e8d9b8"/>
    <!-- sky trim stripe -->
    <path d="M-150 20 Q0 0 150 20" fill="none" stroke="#3A82C4" stroke-width="10" stroke-linecap="round"/>
    <!-- orange nose -->
    <ellipse cx="160" cy="36" rx="28" ry="22" fill="#E88E35" stroke="#9a3412" stroke-width="4"/>
    <!-- windshield -->
    <ellipse cx="40" cy="8" rx="48" ry="22" fill="#7dd3fc" stroke="#0369a1" stroke-width="4"/>
    <ellipse cx="28" cy="2" rx="14" ry="6" fill="#e0f2fe" opacity="0.6"/>
    <!-- portholes -->
    <circle cx="-40" cy="36" r="12" fill="#7dd3fc" stroke="#0369a1" stroke-width="3"/>
    <circle cx="-80" cy="40" r="12" fill="#7dd3fc" stroke="#0369a1" stroke-width="3"/>
    <circle cx="-40" cy="32" r="4" fill="#fff" opacity="0.5"/>
    <circle cx="-80" cy="36" r="4" fill="#fff" opacity="0.5"/>
    <!-- soft mast (rounded, not jagged) -->
    <rect x="-8" y="-90" width="12" height="100" rx="6" fill="#c4a46e" stroke="#8a7048" stroke-width="3"/>
    <ellipse cx="20" y="-70" rx="36" ry="10" fill="#FBF6EE" stroke="#2f4d37" stroke-width="3" opacity="0.85"/>
    <!-- gold star decal -->
    <path d="M-120 20 l4 10 11 1 -9 7 3 10 -9 -6 -9 6 3 -10 -9 -7 11 -1 z" fill="#e4b84a" stroke="#a16207" stroke-width="1.5"/>
  </g>

  <!-- GOLD PILES -->
  <!-- pile A near wreck (left-center) -->
  <g>
    <ellipse cx="420" cy="820" rx="90" ry="28" fill="#c4922a" opacity="0.35"/>
    <circle cx="390" cy="800" r="22" fill="url(#sn-gold)" stroke="#a16207" stroke-width="2"/>
    <circle cx="420" cy="792" r="24" fill="url(#sn-gold)" stroke="#a16207" stroke-width="2"/>
    <circle cx="450" cy="804" r="20" fill="#e4b84a" stroke="#a16207" stroke-width="2"/>
    <circle cx="405" cy="818" r="16" fill="#FFC107" stroke="#a16207" stroke-width="2"/>
    <circle cx="440" cy="820" r="15" fill="#e4b84a" stroke="#a16207" stroke-width="2"/>
    <circle cx="370" cy="816" r="14" fill="#d4a017" stroke="#a16207" stroke-width="2"/>
  </g>

  <!-- pile B — MAIN hide pile, right of wreck / mid-right -->
  <g>
    <ellipse cx="744" cy="760" rx="130" ry="40" fill="#c4922a" opacity="0.3"/>
    <circle cx="690" cy="740" r="26" fill="url(#sn-gold)" stroke="#a16207" stroke-width="2"/>
    <circle cx="730" cy="728" r="28" fill="#e4b84a" stroke="#a16207" stroke-width="2"/>
    <circle cx="780" cy="736" r="24" fill="#FFC107" stroke="#a16207" stroke-width="2"/>
    <circle cx="710" cy="768" r="22" fill="#d4a017" stroke="#a16207" stroke-width="2"/>
    <circle cx="800" cy="760" r="20" fill="url(#sn-gold)" stroke="#a16207" stroke-width="2"/>
    <circle cx="660" cy="770" r="18" fill="#e4b84a" stroke="#a16207" stroke-width="2"/>
    <circle cx="760" cy="776" r="16" fill="#FFC107" stroke="#a16207" stroke-width="2"/>
    <circle cx="820" cy="780" r="15" fill="#d4a017" stroke="#a16207" stroke-width="2"/>
    <circle cx="640" cy="748" r="14" fill="#e4b84a" stroke="#a16207" stroke-width="2"/>
  </g>

  <!-- pile C far right small -->
  <g>
    <circle cx="920" cy="840" r="20" fill="url(#sn-gold)" stroke="#a16207" stroke-width="2"/>
    <circle cx="948" cy="852" r="16" fill="#e4b84a" stroke="#a16207" stroke-width="2"/>
    <circle cx="900" cy="860" r="14" fill="#FFC107" stroke="#a16207" stroke-width="2"/>
  </g>

  <!-- SONAR DISC hide — mixed into gold pile B
       center (744, 704) = leftPct 72.7 / topPct 68.8
       r=44 → 88px, hit ≥64px. Gold-matched, concentric rings are the tell. -->
  <g>
    <circle cx="744" cy="732" r="44" fill="#d4a017" stroke="#a16207" stroke-width="4"/>
    <circle cx="744" cy="732" r="32" fill="none" stroke="#b8860b" stroke-width="3" opacity="0.7"/>
    <circle cx="744" cy="732" r="20" fill="none" stroke="#8a6a10" stroke-width="2.5" opacity="0.65"/>
    <circle cx="744" cy="732" r="8" fill="#c4922a" stroke="#8a6a10" stroke-width="2"/>
    <!-- tiny pip / "antenna" so it reads as a disc not a coin -->
    <path d="M744 688 L744 700" stroke="#a16207" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- overlap coins so it sits IN the pile -->
    <circle cx="710" cy="730" r="18" fill="#e4b84a" stroke="#a16207" stroke-width="2"/>
    <circle cx="776" cy="726" r="16" fill="#FFC107" stroke="#a16207" stroke-width="2"/>
  </g>

  <!-- CUTE PIRATE CRAB (not menacing) -->
  <g transform="translate(430 760)">
    <!-- body -->
    <ellipse cx="0" cy="8" rx="32" ry="22" fill="#E88E35" stroke="#9a3412" stroke-width="4"/>
    <!-- legs -->
    <g stroke="#9a3412" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M-24 16 L-40 28"/><path d="M-16 22 L-28 38"/>
      <path d="M24 16 L40 28"/><path d="M16 22 L28 38"/>
    </g>
    <!-- claws rounded -->
    <ellipse cx="-40" cy="0" rx="14" ry="10" fill="#E88E35" stroke="#9a3412" stroke-width="3"/>
    <ellipse cx="40" cy="0" rx="14" ry="10" fill="#E88E35" stroke="#9a3412" stroke-width="3"/>
    <!-- eye stalks -->
    <path d="M-10 -10 L-12 -26" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 -10 L12 -26" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-12" cy="-30" r="8" fill="#fff" stroke="#1d3023" stroke-width="2"/>
    <circle cx="12" cy="-30" r="8" fill="#fff" stroke="#1d3023" stroke-width="2"/>
    <circle cx="-10" cy="-29" r="3.5" fill="#1d3023"/>
    <circle cx="14" cy="-29" r="3.5" fill="#1d3023"/>
    <circle cx="-9" cy="-31" r="1.3" fill="#fff"/>
    <circle cx="15" cy="-31" r="1.3" fill="#fff"/>
    <!-- smile -->
    <path d="M-8 10 Q0 16 8 10" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-14" cy="6" rx="5" ry="3" fill="#F8A4B8" opacity="0.7"/>
    <ellipse cx="14" cy="6" rx="5" ry="3" fill="#F8A4B8" opacity="0.7"/>
    <!-- tiny pirate hat (dress-up) -->
    <rect x="-18" y="-48" width="36" height="12" rx="3" fill="#2f4d37"/>
    <path d="M-12 -48 L0 -66 L12 -48 Z" fill="#1d3023"/>
    <rect x="-4" y="-58" width="8" height="6" rx="2" fill="#e4b84a"/>
  </g>

  <!-- CUTE PIRATE LOBSTER (not menacing) -->
  <g transform="translate(300 800)">
    <!-- body -->
    <ellipse cx="0" cy="0" rx="20" ry="36" fill="#d4653a" stroke="#9a3412" stroke-width="4"/>
    <ellipse cx="0" cy="36" rx="16" ry="14" fill="#c4542c" stroke="#9a3412" stroke-width="3"/>
    <!-- tail fan -->
    <path d="M-16 48 Q0 62 16 48" fill="#d4653a" stroke="#9a3412" stroke-width="3"/>
    <!-- claws rounded -->
    <ellipse cx="-34" cy="-10" rx="16" ry="10" fill="#d4653a" stroke="#9a3412" stroke-width="3"/>
    <ellipse cx="34" cy="-10" rx="16" ry="10" fill="#d4653a" stroke="#9a3412" stroke-width="3"/>
    <path d="M-18 -8 L-22 -4" stroke="#9a3412" stroke-width="3"/>
    <path d="M18 -8 L22 -4" stroke="#9a3412" stroke-width="3"/>
    <!-- eyes -->
    <circle cx="-8" cy="-28" r="8" fill="#fff" stroke="#1d3023" stroke-width="2"/>
    <circle cx="8" cy="-28" r="8" fill="#fff" stroke="#1d3023" stroke-width="2"/>
    <circle cx="-6" cy="-27" r="3.5" fill="#1d3023"/>
    <circle cx="10" cy="-27" r="3.5" fill="#1d3023"/>
    <circle cx="-5" cy="-29" r="1.2" fill="#fff"/>
    <circle cx="11" cy="-29" r="1.2" fill="#fff"/>
    <!-- smile -->
    <path d="M-6 -8 Q0 -2 6 -8" fill="none" stroke="#9a3412" stroke-width="2.2" stroke-linecap="round"/>
    <!-- tiny sky bandana -->
    <path d="M-16 -36 Q0 -48 16 -36 L12 -30 Q0 -36 -12 -30 Z" fill="#3A82C4" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M16 -36 L26 -30 L20 -40 Z" fill="#38bdf8" stroke="#1e3a5f" stroke-width="2"/>
  </g>
</svg>
