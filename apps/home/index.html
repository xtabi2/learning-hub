<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8e1" />
    <title>Learning Hub</title>
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <h1>Learning Hub</h1>
        <button type="button" class="menu-button" id="menu-button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
          <span></span><span></span><span></span>
        </button>
        <div class="menu" id="menu" role="menu" hidden>
          <button type="button" role="menuitem" id="open-add">Add child</button>
          <button type="button" role="menuitem" id="remove-current" hidden>Remove selected kid</button>
        </div>
      </header>
      <section class="panel" aria-labelledby="who-heading">
        <h2 id="who-heading">Who's playing?</h2>
        <div class="kids" id="kids" role="group" aria-labelledby="who-heading"></div>
      </section>
      <p class="playing" id="playing" role="status"></p>
      <nav class="games" aria-label="Games">
        <a class="game math" id="math" href="/math/">Math</a>
        <a class="game reading" id="reading" href="/reading/">Reading</a>
        <a class="game adventure" id="adventure" href="/adventure/">Adventure</a>
      </nav>
    </main>
    <dialog class="add-dialog" id="add-dialog" aria-labelledby="add-heading">
      <form class="add" id="add-form">
        <h2 id="add-heading">Add child</h2>
        <label>
          Name
          <input id="name" name="name" maxlength="40" autocomplete="off" required />
        </label>
        <div class="row">
          <label>
            Age
            <input id="age" name="age" type="number" min="0" max="18" step="1" inputmode="numeric" />
          </label>
          <label>
            Grade
            <select id="grade" name="grade">
              <option value="PreK">Pre-K</option>
              <option value="K">Kindergarten</option>
              <option value="1">1st grade</option>
              <option value="2">2nd grade</option>
              <option value="3">3rd grade</option>
            </select>
          </label>
        </div>
        <fieldset class="avatar-picker">
          <legend>Pick an animal</legend>
          <div class="avatar-grid" id="avatar-grid"></div>
        </fieldset>
        <p class="note" id="note" role="status"></p>
        <div class="actions">
          <button type="button" class="cancel" id="cancel-add">Cancel</button>
          <button type="submit">Add this kid</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
